name: NextSilicon
description: 'NextSilicon is a deep-tech compute company building intelligent, software-defined
  acceleration hardware for high-performance computing, AI, and vector-database workloads.
  Its flagship Maverick-2 is a dataflow accelerator built on the Intelligent Compute
  Architecture (ICA) that reconfigures itself at runtime, and its Arbel product is a
  server-class RISC-V CPU core on TSMC process. A developer toolchain supports C/C++,
  FORTRAN, OpenMP, and Kokkos, with planned CUDA and HIP/ROCm paths, letting teams run
  existing code faster without rewrites or vendor lock-in. NextSilicon publishes no
  public web API, SDK registry package, or open developer portal; its documentation
  site is gated, so this profile captures company identity, its GitHub organization
  (largely upstream compiler/Kokkos forks), and domain-security posture.'
